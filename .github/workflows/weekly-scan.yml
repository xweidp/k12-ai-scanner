name: Monthly K-12 Resource Scan & Inventory Update

on:
  schedule:
    # 1st of every month at 1:00 PM UTC (8:00 AM Central)
    - cron: '0 13 1 * *'
  workflow_dispatch:  # Allow manual trigger

# Required so the scanner bot can push the updated inventory back to the repo.
# Without this, GITHUB_TOKEN is read-only and every run dies at `git push`.
permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl beautifulsoup4 feedparser

      - name: Run generic monitor-source scanner
        run: python3 scan-resources.py

      - name: Run GitHub & Hugging Face direct scanner
        run: python3 scan-github-hf.py

      - name: Scan for K-12 AI leaderboards
        run: python3 scan-leaderboards.py

      - name: Scan for K-12 AI benchmarks
        run: python3 scan-benchmarks.py

      - name: Scan for K-12 AI data catalogs
        run: python3 scan-data-catalogs.py

      - name: Merge scan results
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path

          results = {'resources': []}

          # Load all scan results
          for file in ['data/resources.json', 'data/github_hf_scan_results.json']:
              if Path(file).exists():
                  with open(file) as f:
                      data = json.load(f)
                      results['resources'].extend(data.get('resources', []))

          # Dedupe by URL
          seen_urls = set()
          deduped = []
          for res in results['resources']:
              url = res.get('url', '')
              if url not in seen_urls:
                  seen_urls.add(url)
                  deduped.append(res)

          results['resources'] = deduped
          results['scannedAt'] = deduped[0].get('discovery_date') if deduped else ''
          results['totalScanned'] = len(deduped)

          with open('data/all_scanned_resources.json', 'w') as f:
              json.dump(results, f, indent=2)

          print(f"Merged {len(deduped)} total resources from all scans")
          EOF

      - name: Update inventory with new discoveries
        run: |
          python3 << 'EOF'
          import json
          import hashlib
          import pandas as pd
          from datetime import datetime, timezone
          from pathlib import Path

          def stable_id(url):
              """Deterministic record id. Python's hash() is randomized per process,
              which would mint a new id for the same URL on every run."""
              return 'new_' + hashlib.sha1(str(url).encode()).hexdigest()[:10]

          def resolve_type(url, scanner_category):
              """An ArXiv paper *describing* a benchmark is not itself a benchmark.

              The scanners label everything they surface with the category they
              were searching for, which would file research papers into the
              hand-curated Benchmark and Leaderboard sets. Type by what the
              artifact actually is."""
              u = str(url or '').lower()
              if 'arxiv.org' in u:
                  return 'Research_Paper'
              return scanner_category

          # Load base inventory
          try:
              inventory = pd.read_csv('data/k12_inventory_latest.csv')
          except:
              print("Error: Cannot find k12_inventory_latest.csv")
              exit(1)

          # ADDITIVE-ONLY CONTRACT: this step may only ever append rows.
          # We record the starting state and verify nothing was lost at the end.
          starting_count = len(inventory)
          starting_urls = set(inventory['url'].dropna().tolist()) if 'url' in inventory.columns else set()
          print(f"Existing inventory: {starting_count} records (these will all be preserved)")

          # REJECTION LIST: URLs removed during manual review. Dedup alone can't
          # keep these out - deleting a row frees its URL, so the next scan would
          # treat it as a brand-new find and re-add it. This makes deletion stick.
          rejected_urls = set()
          if Path('data/rejected_urls.csv').exists():
              rejected_urls = set(pd.read_csv('data/rejected_urls.csv')['url'].dropna().tolist())
              print(f"Rejection list: {len(rejected_urls)} URLs will be skipped")

          new_records = []
          # Treating rejected URLs as "already seen" is what blocks re-adding them.
          existing_urls = set(starting_urls) | rejected_urls

          # 1. Load leaderboards
          if Path('data/k12_leaderboards_discovered.csv').exists():
              leaderboards = pd.read_csv('data/k12_leaderboards_discovered.csv')
              for _, row in leaderboards.iterrows():
                  url = row.get('source_url', '')
                  if url not in existing_urls:
                      new_records.append({
                          'record_id': stable_id(url),
                          'resource_name': row.get('resource_name', '')[:100],
                          'author_name': row.get('organization', ''),
                          'url': url,
                          'resource_subtype': resolve_type(url, 'Leaderboard'),
                          'discovery_date': datetime.now(timezone.utc).strftime('%Y-%m-%d'),
                          'discovery_source': row.get('organization', 'Scanner'),
                          # Carry the scanner's prose and date through, or the row
                          # lands with no description and no date on the site.
                          'description': str(row.get('description', ''))[:600],
                          'publication_date': row.get('announcement_date', ''),
                          'fit_score': 70
                      })
                      existing_urls.add(url)

          # 3. Load benchmarks
          if Path('data/k12_benchmarks_discovered.csv').exists():
              benchmarks = pd.read_csv('data/k12_benchmarks_discovered.csv')
              for _, row in benchmarks.iterrows():
                  url = row.get('source_url', '')
                  if url not in existing_urls:
                      new_records.append({
                          'record_id': stable_id(url),
                          'resource_name': row.get('resource_name', '')[:100],
                          'author_name': row.get('organization', ''),
                          'url': url,
                          'resource_subtype': resolve_type(url, 'Benchmark'),
                          'discovery_date': datetime.now(timezone.utc).strftime('%Y-%m-%d'),
                          'discovery_source': row.get('organization', 'Scanner'),
                          # Carry the scanner's prose and date through, or the row
                          # lands with no description and no date on the site.
                          'description': str(row.get('description', ''))[:600],
                          'publication_date': row.get('announcement_date', ''),
                          'fit_score': 68
                      })
                      existing_urls.add(url)

          # 4. Load data catalogs
          if Path('data/k12_data_catalogs_discovered.csv').exists():
              catalogs = pd.read_csv('data/k12_data_catalogs_discovered.csv')
              for _, row in catalogs.iterrows():
                  url = row.get('source_url', '')
                  if url not in existing_urls:
                      new_records.append({
                          'record_id': stable_id(url),
                          'resource_name': row.get('resource_name', '')[:100],
                          'author_name': row.get('organization', ''),
                          'url': url,
                          'resource_subtype': resolve_type(url, 'Data Catalog'),
                          'discovery_date': datetime.now(timezone.utc).strftime('%Y-%m-%d'),
                          'discovery_source': row.get('organization', 'Scanner'),
                          # Carry the scanner's prose and date through, or the row
                          # lands with no description and no date on the site.
                          'description': str(row.get('description', ''))[:600],
                          'publication_date': row.get('announcement_date', ''),
                          'fit_score': 75
                      })
                      existing_urls.add(url)

          # Merge with inventory
          if new_records:
              new_df = pd.DataFrame(new_records)
              # Ensure all columns exist
              for col in inventory.columns:
                  if col not in new_df.columns:
                      new_df[col] = ''
              # Add any new columns from new_df to inventory
              for col in new_df.columns:
                  if col not in inventory.columns:
                      inventory[col] = ''

              combined = pd.concat([inventory, new_df], ignore_index=True)
              # keep='first' means an existing curated row always wins over a
              # freshly-scanned duplicate, so manual edits are never overwritten.
              combined = combined.drop_duplicates(subset=['url'], keep='first')

              # --- Verify the additive-only contract before writing ---
              surviving_urls = set(combined['url'].dropna().tolist())
              lost = starting_urls - surviving_urls
              if lost:
                  print(f"ABORT: {len(lost)} pre-existing records would be lost:")
                  for u in list(lost)[:10]:
                      print(f"   - {u}")
                  raise SystemExit(1)
              if len(combined) < starting_count:
                  print(f"ABORT: record count shrank {starting_count} -> {len(combined)}")
                  raise SystemExit(1)
              print(f"Additive-only check passed: all {starting_count} prior records intact")

              # Nothing on the rejection list may ever reach the inventory.
              readmitted = rejected_urls & surviving_urls
              if readmitted:
                  print(f"ABORT: {len(readmitted)} rejected URLs were re-admitted:")
                  for u in list(readmitted)[:10]:
                      print(f"   - {u}")
                  raise SystemExit(1)

              combined.to_csv('data/k12_inventory_latest.csv', index=False)
              print(f"Updated inventory: {len(combined)} total records (+{len(combined) - starting_count} new)")
              print(f"  - Leaderboards: {len([r for r in new_records if r['resource_subtype'] == 'Leaderboard'])}")
              print(f"  - Benchmarks: {len([r for r in new_records if r['resource_subtype'] == 'Benchmark'])}")
              print(f"  - Data Catalogs: {len([r for r in new_records if r['resource_subtype'] == 'Data Catalog'])}")
          else:
              print("No new resources to add")
          EOF

      - name: Commit and push results
        run: |
          git config user.name "K-12 Scanner Bot"
          git config user.email "scanner@digitalpromise.org"
          git add data/
          if git diff --staged --quiet; then
            echo "No inventory changes this month - nothing to commit."
          else
            git commit -m "Monthly K-12 scan & inventory update - $(date -u +'%Y-%m-%d') UTC"
            # Rebase in case the site was edited between checkout and push
            git pull --rebase --autostash origin main
            git push
            echo "Pushed updated inventory."
          fi
